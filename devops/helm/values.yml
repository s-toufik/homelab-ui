replicas: 1

ports:
  - name: http
    port: 8080

probes:
  readiness:
    httpGet: { path: /, port: http }
    periodSeconds: 10
  liveness:
    httpGet: { path: /, port: http }
    periodSeconds: 20

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 128Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
securityContext:
  readOnlyRootFilesystem: true
extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
