# How homelab-ui runs on the homelab: values for the `app` chart (kube-charts). CI builds the
# chart from this file on a release tag vX.Y.Z; every key is described in kube-charts'
# charts/app/values.yaml. Served by the gateway at https://<domain>/, signed in.

ports:
  - name: http
    port: 8080

probes:
  readiness:
    httpGet: { path: /, port: http }
    periodSeconds: 10
  liveness:
    httpGet: { path: /, port: http }
    periodSeconds: 20

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 128Mi }

# nginx-unprivileged runs as user 101 and writes only to /tmp
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
securityContext:
  readOnlyRootFilesystem: true
extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
