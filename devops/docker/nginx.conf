server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy to agent-orchestrator so the UI never needs a
    # configurable/visible backend URL, and to avoid CORS entirely.
    location /api/ {
        proxy_pass http://agent-orchestrator:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # /v1/stream is Server-Sent Events: disable buffering so tokens
        # reach the browser as they're produced instead of being held back.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
