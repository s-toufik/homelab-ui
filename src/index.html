<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Homelab</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b16" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      (function () {
        try {
          var saved =
            JSON.parse(localStorage.getItem('homelab-ui.theme-preferences') || 'null') || {};
          var palette = [
            'classic',
            'terminal',
            'paper',
            'nightshift',
            'aurora',
            'arcade',
            'nord',
            'neon',
            'sandstone',
          ].includes(saved.palette)
            ? saved.palette
            : 'classic';
          document.documentElement.setAttribute('data-palette', palette);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
