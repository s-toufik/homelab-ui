<div class="home-page">
  <h1 class="home-page__title">Homelab</h1>

  <div class="home-page__grid">
    @for (item of navItems; track item.path) {
      <a class="home-page__card" [routerLink]="item.path">
        <span class="home-page__card-label">{{ item.label }}</span>
        <p class="home-page__card-description">{{ item.description }}</p>
      </a>
    }
  </div>
</div>
