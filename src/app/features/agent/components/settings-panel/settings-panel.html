<div class="settings-panel__field settings-panel__field--block">
  <label for="model">
    <svg
      viewBox="0 0 24 24"
      width="16"
      height="16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
    >
      <rect x="6" y="6" width="12" height="12" rx="1.5" />
      <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" stroke-linecap="round" />
    </svg>
    Model
  </label>
  <select id="model" [ngModel]="modelName()" (ngModelChange)="modelName.set($event)">
    @for (model of knownModels(); track model) {
      <option [value]="model">{{ model }}</option>
    }
  </select>
</div>

<div class="settings-panel__field settings-panel__field--block">
  <label for="session">
    <svg
      viewBox="0 0 24 24"
      width="16"
      height="16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
    >
      <path
        d="M3 11.5V6a2 2 0 0 1 2-2h5.5a2 2 0 0 1 1.4.6l7.1 7.1a2 2 0 0 1 0 2.8l-5.5 5.5a2 2 0 0 1-2.8 0l-7.1-7.1A2 2 0 0 1 3 11.5Z"
        stroke-linejoin="round"
      />
      <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none" />
    </svg>
    Session
  </label>
  <input id="session" type="text" [ngModel]="sessionId()" (ngModelChange)="sessionId.set($event)" />
</div>

<button type="button" class="settings-panel__action" (click)="newSession.emit()">
  <svg
    viewBox="0 0 24 24"
    width="18"
    height="18"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
  >
    <path d="M12 5v14M5 12h14" stroke-linecap="round" />
  </svg>
  New session
</button>
