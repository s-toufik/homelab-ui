<section class="settings-panel__group">
  <label class="settings-panel__row settings-panel__row--select" for="model">
    <span>Model</span>
    <span class="settings-panel__value">
      <select
        id="model"
        [ngModel]="modelName()"
        (ngModelChange)="modelName.set($event)"
        [disabled]="models().length === 0"
        aria-describedby="model-hint"
      >
        @for (model of models(); track model) {
          <option [value]="model">{{ model }}</option>
        } @empty {
          <option value="">{{ modelsError() ? 'Unavailable' : 'Loading…' }}</option>
        }
      </select>
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
  </label>

  <label class="settings-panel__row" for="auto-approve">
    <span>Auto-approve plans</span>
    <input
      id="auto-approve"
      class="settings-panel__switch"
      type="checkbox"
      role="switch"
      [ngModel]="autoApprove()"
      (ngModelChange)="autoApprove.set($event)"
      aria-describedby="auto-approve-hint"
    />
  </label>
</section>
@if (modelsError() || pinnedNote(); as note) {
  <p
    id="model-hint"
    class="settings-panel__hint"
    [class.settings-panel__hint--error]="!!modelsError()"
  >
    {{ note }}
  </p>
}
<p id="auto-approve-hint" class="settings-panel__hint">
  Auto-approve runs a plan without your approval.
</p>

<section class="settings-panel__group">
  <div class="settings-panel__row">
    <label for="session">Conversation</label>
    <button
      type="button"
      class="settings-panel__copy"
      [attr.aria-label]="copied() ? 'Conversation id copied' : 'Copy conversation id'"
      (click)="copySessionId()"
    >
      @if (copied()) {
        <svg
          viewBox="0 0 24 24"
          width="15"
          height="15"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M4 12.5 9.5 18 20 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Copied
      } @else {
        <svg
          viewBox="0 0 24 24"
          width="15"
          height="15"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect x="8" y="8" width="12" height="12" rx="2" />
          <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
        </svg>
        Copy
      }
    </button>
  </div>

  <div class="settings-panel__row settings-panel__row--field">
    <input
      id="session"
      class="settings-panel__id"
      type="text"
      spellcheck="false"
      autocomplete="off"
      autocapitalize="off"
      aria-describedby="session-hint"
      [ngModel]="sessionId()"
      (ngModelChange)="sessionId.set($event)"
    />
  </div>

  <button
    type="button"
    class="settings-panel__row settings-panel__row--action"
    (click)="newSession.emit()"
  >
    <svg
      viewBox="0 0 24 24"
      width="17"
      height="17"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.4A8 8 0 1 1 20 12Z" stroke-linejoin="round" />
      <path d="M12 9v6M9 12h6" stroke-linecap="round" />
    </svg>
    Start a new conversation
  </button>
</section>
<p id="session-hint" class="settings-panel__hint">
  Paste an earlier conversation's id to continue it.
</p>
