<ng-template appPagePanelContent>
  <app-settings-panel
    [models]="store.modelNames()"
    [pinnedSteps]="store.pinnedSteps()"
    [modelsError]="store.modelsError()"
    [(modelName)]="store.modelName"
    [(sessionId)]="store.sessionId"
    [(autoApprove)]="store.autoApprove"
    (newSession)="store.newSession()"
  />
</ng-template>

<div class="agent-page">
  <app-conversation [messages]="store.messages()" (resend)="store.resend($event)" />

  @if (store.requestError()) {
    <p class="agent-page__banner" role="alert">{{ store.requestError() }}</p>
  }

  <app-composer
    [(draft)]="store.draft"
    [canSend]="store.canSend()"
    [isStreaming]="store.isStreaming()"
    (send)="store.send()"
    (cancel)="store.cancel()"
  />
</div>
