<div
  class="layout"
  [class.layout--resizing]="ui.resizing()"
  [class.layout--drawer]="ui.drawerOpen()"
  [style.--assistant-width]="ui.assistantWidth() + 'px'"
  (touchstart)="touchStart($event)"
  (touchend)="touchEnd($event)"
>
  <app-sidebar />
  <app-drawer />

  <div class="layout__main">
    @if (ui.drawerOpen()) {
      <button
        type="button"
        class="layout__shade"
        aria-label="Close the menu"
        (click)="ui.drawerOpen.set(false)"
      ></button>
    }
    <app-phone-bar>
      @if (chrome.rightPanel() && !chrome.titleMenu()) {
        <button
          type="button"
          class="layout__tool layout__tool--phone"
          title="Page settings"
          aria-label="Open page settings"
          (click)="ui.togglePanel()"
        >
          <svg
            viewBox="0 0 24 24"
            width="17"
            height="17"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
            <circle cx="9" cy="6" r="2" fill="var(--surface)" />
            <circle cx="15" cy="12" r="2" fill="var(--surface)" />
            <circle cx="9" cy="18" r="2" fill="var(--surface)" />
          </svg>
        </button>
      }
    </app-phone-bar>
    @if (assistantAvailable() && !ui.assistantOpen()) {
      <button
        type="button"
        class="layout__floating-tool"
        [class.layout__floating-tool--working]="assistantWorking()"
        [title]="assistantWorking() ? 'Assistant (working…)' : 'Ask about this page'"
        aria-label="Open the assistant beside this page"
        (click)="ui.toggleAssistant()"
      >
        <app-swarm-avatar [size]="20" [live]="assistantWorking()" [phase]="assistantPhase()" />
      </button>
    }

    <main
      class="layout__content"
      [class.layout__content--beside-assistant]="assistantAvailable() && ui.assistantOpen()"
    >
      <router-outlet />
    </main>
  </div>

  @if (chrome.rightPanel()) {
    <app-page-panel />
  }

  @if (assistantAvailable()) {
    <app-assistant-drawer />
  }

  <app-settings-modal />
  <app-command-palette />
</div>
