name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    # Only tags publish. A tag on main (vX.Y.Z): image toufik142/homelab-ui:X.Y.Z and :latest, chart homelab-ui:X.Y.Z
    # A tag on develop (vX.Y.Z-rc.N): image toufik142/homelab-ui:X.Y.Z-rc.N and :dev, no chart
    tags: ['v*.*.*']

jobs:
  lint:
    name: 🧹 LINT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prettier
        run: npx prettier --check .

  typecheck:
    name: 🔍 TYPECHECK
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tsc
        run: npx tsc -p tsconfig.app.json --noEmit

  test:
    name: 🧪 TEST
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx ng test --watch=false

  build:
    name: 🐳 BUILD
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 🏷️ RELEASE TARGET
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    outputs:
      channel: ${{ steps.target.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the branch the tag is on
        id: target
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/develop:refs/remotes/origin/develop
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            channel=release
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            channel=prerelease
          else
            echo "::error::$GITHUB_REF_NAME is on neither main nor develop: nothing is published"
            exit 1
          fi
          final='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$channel" = release ] && ! [[ "$GITHUB_REF_NAME" =~ $final ]]; then
            echo "::error::$GITHUB_REF_NAME is on main: a release is vX.Y.Z"
            exit 1
          fi
          if [ "$channel" = prerelease ] && [[ "$GITHUB_REF_NAME" =~ $final ]]; then
            echo "::error::$GITHUB_REF_NAME is only on develop: a pre-release is vX.Y.Z-rc.N"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "::notice::$GITHUB_REF_NAME is a $channel"

  publish:
    name: 🚀 PUBLISH
    runs-on: ubuntu-latest
    needs: [build, release]
    if: github.ref_type == 'tag'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: tag
        env:
          CHANNEL: ${{ needs.release.outputs.channel }}
        run: |
          image=toufik142/homelab-ui
          version="${GITHUB_REF_NAME#v}"
          if [ "$CHANNEL" = release ]; then
            echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:$version,$image:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: 📦 CHART
    needs: [publish, release]
    if: needs.release.outputs.channel == 'release'
    uses: s-toufik/kube-charts/.github/workflows/app-chart.yml@main
    permissions:
      contents: read
      packages: write
    with:
      name: homelab-ui
      image: toufik142/homelab-ui
