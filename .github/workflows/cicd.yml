name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    # A release: image toufik142/homelab-ui:X.Y.Z and chart oci://ghcr.io/s-toufik/charts/homelab-ui:X.Y.Z
    tags: ['v*.*.*']

jobs:
  lint:
    name: 🧹 LINT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prettier
        run: npx prettier --check .

  typecheck:
    name: 🔍 TYPECHECK
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tsc
        run: npx tsc -p tsconfig.app.json --noEmit

  test:
    name: 🧪 TEST
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx ng test --watch=false

  build:
    name: 🐳 BUILD
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: 🚀 PUBLISH
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=toufik142/homelab-ui:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            printf 'tags=toufik142/homelab-ui:latest,toufik142/homelab-ui:latest-%s\n' "${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=toufik142/homelab-ui:dev,toufik142/homelab-ui:dev-%s\n' "${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: 📦 CHART
    needs: publish
    if: github.ref_type == 'tag'
    uses: s-toufik/kube-charts/.github/workflows/app-chart.yml@main
    permissions:
      contents: read
      packages: write
    with:
      name: homelab-ui
      image: toufik142/homelab-ui
